<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOL Terminal - {{ system_name }}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- xterm.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    
    <style>
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        
        .terminal-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .terminal-header {
            background-color: #2d2d30;
            padding: 10px 20px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            justify-content: between;
            align-items: center;
            flex-shrink: 0;
        }
        
        .terminal-title {
            color: #ffffff;
            margin: 0;
            font-size: 16px;
            font-weight: 500;
        }
        
        .terminal-info {
            font-size: 12px;
            color: #cccccc;
            margin-left: 20px;
        }
        
        .terminal-controls {
            display: flex;
            gap: 10px;
            margin-left: auto;
        }
        
        .control-btn {
            background: #007acc;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .control-btn:hover {
            background: #005a9e;
        }
        
        .control-btn.danger {
            background: #d73a49;
        }
        
        .control-btn.danger:hover {
            background: #b52d3a;
        }
        
        .terminal-body {
            flex: 1;
            padding: 0;
            position: relative;
            overflow: hidden;
        }
        
        #terminal {
            height: 100%;
            width: 100%;
        }
        
        .status-bar {
            background-color: #007acc;
            color: white;
            padding: 5px 20px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #28a745;
            animation: pulse 2s infinite;
        }
        
        .status-dot.disconnected {
            background-color: #dc3545;
            animation: none;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .error-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1e1e1e;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        
        .error-icon {
            font-size: 48px;
            color: #dc3545;
            margin-bottom: 20px;
        }
        
        .error-message {
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        .error-details {
            font-size: 14px;
            color: #cccccc;
            margin-bottom: 20px;
        }
        
        .retry-btn {
            background: #007acc;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        
        .retry-btn:hover {
            background: #005a9e;
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    {% if error %}
    <div class="error-container">
        <i class="fas fa-exclamation-triangle error-icon"></i>
        <div class="error-message">SOL Terminal Error</div>
        <div class="error-details">{{ error }}</div>
        <a href="javascript:history.back()" class="retry-btn">
            <i class="fas fa-arrow-left me-2"></i>Go Back
        </a>
    </div>
    {% else %}
    <div class="terminal-container">
        <div class="terminal-header">
            <h1 class="terminal-title">
                <i class="fas fa-terminal me-2"></i>SOL Console - {{ system_name }}
            </h1>
            <div class="terminal-info">
                BMC: {{ bmc_ip }} | User: {{ bmc_user }}
            </div>
            <div class="terminal-controls">
                <button class="control-btn" onclick="clearTerminal()">
                    <i class="fas fa-broom me-1"></i>Clear
                </button>
                <button class="control-btn" onclick="reconnectSOL()">
                    <i class="fas fa-sync me-1"></i>Reconnect
                </button>
                <button class="control-btn danger" onclick="disconnectSOL()">
                    <i class="fas fa-times me-1"></i>Disconnect
                </button>
            </div>
        </div>
        
        <div class="terminal-body">
            <div id="terminal"></div>
        </div>
        
        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
            <div id="connectionInfo">
                Folder: {{ folder_name }} | Terminal: xterm.js
            </div>
        </div>
    </div>
    {% endif %}

    <!-- xterm.js JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.js"></script>

    <script>
        // Terminal and WebSocket variables
        let terminal;
        let websocket;
        let fitAddon;
        let isConnected = false;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;
        
        // Terminal configuration
        const terminalConfig = {
            cursorBlink: true,
            cursorStyle: 'block',
            fontFamily: 'Consolas, Monaco, "Courier New", monospace',
            fontSize: 14,
            lineHeight: 1.2,
            theme: {
                background: '#1e1e1e',
                foreground: '#ffffff',
                cursor: '#ffffff',
                selection: '#3a3d41',
                black: '#000000',
                red: '#cd3131',
                green: '#0dbc79',
                yellow: '#e5e510',
                blue: '#2472c8',
                magenta: '#bc3fbc',
                cyan: '#11a8cd',
                white: '#e5e5e5',
                brightBlack: '#666666',
                brightRed: '#f14c4c',
                brightGreen: '#23d18b',
                brightYellow: '#f5f543',
                brightBlue: '#3b8eea',
                brightMagenta: '#d670d6',
                brightCyan: '#29b8db',
                brightWhite: '#e5e5e5'
            },
            allowTransparency: false,
            convertEol: true,
            scrollback: 1000
        };

        function initializeTerminal() {
            // Create terminal instance
            terminal = new Terminal(terminalConfig);
            
            // Add fit addon
            fitAddon = new FitAddon.FitAddon();
            terminal.loadAddon(fitAddon);
            
            // Add web links addon
            const webLinksAddon = new WebLinksAddon.WebLinksAddon();
            terminal.loadAddon(webLinksAddon);
            
            // Open terminal in the container
            terminal.open(document.getElementById('terminal'));
            
            // Fit terminal to container
            fitAddon.fit();
            
            // Handle terminal input
            terminal.onData(data => {
                if (websocket && websocket.readyState === WebSocket.OPEN) {
                    websocket.send(JSON.stringify({
                        type: 'input',
                        data: data
                    }));
                }
            });
            
            // Handle terminal resize
            terminal.onResize(size => {
                if (websocket && websocket.readyState === WebSocket.OPEN) {
                    websocket.send(JSON.stringify({
                        type: 'resize',
                        rows: size.rows,
                        cols: size.cols
                    }));
                }
            });
            
            // Handle window resize
            window.addEventListener('resize', () => {
                fitAddon.fit();
            });
            
            // Show initial message
            terminal.writeln('\x1b[1;32m╔══════════════════════════════════════════════════════════════╗\x1b[0m');
            terminal.writeln('\x1b[1;32m║                    SOL Terminal Starting                     ║\x1b[0m');
            terminal.writeln('\x1b[1;32m║              Connecting to {{ bmc_ip }}...              ║\x1b[0m');
            terminal.writeln('\x1b[1;32m╚══════════════════════════════════════════════════════════════╝\x1b[0m');
            terminal.writeln('');
        }

        function connectWebSocket() {
            const wsUrl = "{{ websocket_url|escapejs }}";
            
            try {
                websocket = new WebSocket(wsUrl);
                
                websocket.onopen = function(event) {
                    console.log('WebSocket connected');
                    isConnected = true;
                    reconnectAttempts = 0;
                    updateStatus('Connected', true);
                    terminal.writeln('\x1b[1;32m[SOL] Connected to BMC {{ bmc_ip }}\x1b[0m');
                };
                
                websocket.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        
                        if (data.type === 'output') {
                            terminal.write(data.data);
                        } else if (data.type === 'info') {
                            terminal.write('\x1b[1;36m' + data.message + '\x1b[0m');
                        } else if (data.type === 'error') {
                            terminal.writeln('\x1b[1;31m[ERROR] ' + data.message + '\x1b[0m');
                        }
                    } catch (e) {
                        console.error('Error parsing WebSocket message:', e);
                    }
                };
                
                websocket.onclose = function(event) {
                    console.log('WebSocket disconnected:', event.code, event.reason);
                    isConnected = false;
                    updateStatus('Disconnected', false);
                    
                    if (event.code !== 1000) { // Not a normal closure
                        terminal.writeln('\x1b[1;31m[SOL] Connection lost\x1b[0m');
                        
                        if (reconnectAttempts < maxReconnectAttempts) {
                            setTimeout(() => {
                                reconnectAttempts++;
                                terminal.writeln(`\x1b[1;33m[SOL] Reconnecting... (${reconnectAttempts}/${maxReconnectAttempts})\x1b[0m`);
                                connectWebSocket();
                            }, 2000 * reconnectAttempts);
                        } else {
                            terminal.writeln('\x1b[1;31m[SOL] Maximum reconnection attempts reached\x1b[0m');
                        }
                    }
                };
                
                websocket.onerror = function(error) {
                    console.error('WebSocket error:', error);
                    terminal.writeln('\x1b[1;31m[SOL] Connection error\x1b[0m');
                    updateStatus('Error', false);
                };
                
            } catch (error) {
                console.error('Failed to create WebSocket:', error);
                terminal.writeln('\x1b[1;31m[SOL] Failed to create connection\x1b[0m');
                updateStatus('Error', false);
            }
        }

        function updateStatus(text, connected) {
            const statusText = document.getElementById('statusText');
            const statusDot = document.getElementById('statusDot');
            
            statusText.textContent = text;
            
            if (connected) {
                statusDot.classList.remove('disconnected');
            } else {
                statusDot.classList.add('disconnected');
            }
        }

        function clearTerminal() {
            if (terminal) {
                terminal.clear();
            }
        }

        function reconnectSOL() {
            if (websocket) {
                websocket.close();
            }
            reconnectAttempts = 0;
            terminal.writeln('\x1b[1;33m[SOL] Reconnecting...\x1b[0m');
            setTimeout(connectWebSocket, 1000);
        }

        function disconnectSOL() {
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                try {
                    // Send SOL exit sequence first
                    websocket.send(JSON.stringify({
                        type: 'input',
                        data: '~.'
                    }));
                    
                    // Send explicit disconnect message
                    websocket.send(JSON.stringify({
                        type: 'disconnect',
                        reason: 'User clicked disconnect button'
                    }));
                    
                    // Close WebSocket
                    websocket.close(1000, 'User disconnected');
                } catch (e) {
                    console.error('Error during disconnect:', e);
                    websocket.close();
                }
            }
            terminal.writeln('\x1b[1;33m[SOL] Disconnected by user\x1b[0m');
            updateStatus('Disconnected', false);
            
            // Prevent reconnection attempts
            reconnectAttempts = maxReconnectAttempts;
        }

        function cleanupSOLSession() {
            console.log('Cleaning up SOL session...');
            
            // Send SOL exit sequence first
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                try {
                    // Send SOL exit sequence (~.)
                    websocket.send(JSON.stringify({
                        type: 'input',
                        data: '~.'
                    }));
                    
                    // Send explicit disconnect message
                    websocket.send(JSON.stringify({
                        type: 'disconnect',
                        reason: 'Page closing'
                    }));
                    
                    // Close WebSocket with proper code
                    websocket.close(1000, 'Page closing - SOL session terminated');
                } catch (e) {
                    console.error('Error during SOL cleanup:', e);
                    // Force close if there's an error
                    websocket.close();
                }
            }
            
            // Clear any reconnection attempts
            reconnectAttempts = maxReconnectAttempts;
            isConnected = false;
        }

        // Initialize everything when page loads
        document.addEventListener('DOMContentLoaded', function() {
            initializeTerminal();
            setTimeout(connectWebSocket, 1000); // Small delay to ensure terminal is ready
        });

        // Enhanced cleanup when page unloads
        window.addEventListener('beforeunload', function(event) {
            cleanupSOLSession();
        });

        // Also handle page visibility changes (tab switching, minimizing)
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                console.log('Page hidden - maintaining SOL connection');
            } else {
                console.log('Page visible - SOL connection active');
            }
        });

        // Handle window focus events
        window.addEventListener('focus', function() {
            console.log('Window focused - SOL terminal active');
        });

        window.addEventListener('blur', function() {
            console.log('Window blurred - SOL terminal backgrounded');
        });

        // Additional cleanup for various page close scenarios
        window.addEventListener('unload', function() {
            cleanupSOLSession();
        });

        // Handle browser back/forward navigation
        window.addEventListener('pagehide', function() {
            cleanupSOLSession();
        });

        // Handle keyboard shortcuts
        document.addEventListener('keydown', function(event) {
            // Ctrl+C to interrupt
            if (event.ctrlKey && event.key === 'c') {
                if (websocket && websocket.readyState === WebSocket.OPEN) {
                    websocket.send(JSON.stringify({
                        type: 'input',
                        data: '\x03' // Ctrl+C
                    }));
                }
                event.preventDefault();
            }
            
            // Ctrl+D to send EOF
            if (event.ctrlKey && event.key === 'd') {
                if (websocket && websocket.readyState === WebSocket.OPEN) {
                    websocket.send(JSON.stringify({
                        type: 'input',
                        data: '\x04' // Ctrl+D
                    }));
                }
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
